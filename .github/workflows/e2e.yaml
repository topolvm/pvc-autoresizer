name: "e2e"
on:
  pull_request:
    paths-ignore:
        - "**/*.md"
        - "CODEOWNERS"
  push:
    paths-ignore:
        - "**/*.md"
        - "CODEOWNERS"
    branches:
      - "main"

jobs:
  e2e-k8s:
    name: "e2e-k8s"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        kubernetes_versions: ["1.35.4", "1.34.3", "1.33.7"]
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - run: make -C test/e2e setup
      - run: make -C test/e2e init-app-with-cert-manager
      - run: make -C test/e2e test

  e2e-k8s-without-cert-manager:
    name: "e2e-k8s-without-cert-manager"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        kubernetes_versions: ["1.35.4", "1.34.3", "1.33.7"]
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - run: make -C test/e2e setup
      - run: make -C test/e2e init-app-without-cert-manager
      - run: make -C test/e2e test

  e2e-k8s-with-metrics-api:
    name: "e2e-k8s-with-metrics-api"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        kubernetes_versions: ["1.35.4", "1.34.3", "1.33.7"]
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - run: make -C test/e2e setup
      - run: make -C test/e2e init-app-with-metrics-api
      - run: make -C test/e2e test
